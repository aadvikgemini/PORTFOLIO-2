# Cloudflare Pages Deployment Configuration
name = "aadvik-gemini-portfolio"
compatibility_date = "2026-11-01"
pages_build_output_dir = "."

# Optional Distributed Rate Limiting Binding (recommended in production)
# Uncomment and configure in Cloudflare Pages Dashboard -> Settings -> Functions -> Bindings:
#
# [[ratelimits]]
# name = "CONTACT_RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 5, period = 60 }
#
# Alternative KV-backed distributed rate limiting:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "replace_with_your_kv_namespace_id"
